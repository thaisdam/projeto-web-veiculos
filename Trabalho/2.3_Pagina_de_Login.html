<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">


</head>

<body>
    <header>
        <div class="logo-titulo"> <img src="images/logo.png" alt="logo" width="100" height="100">
            <h1>Sally Motors</h1>
        </div>
        <nav class="header-nav">
            <a href="index.html">Voltar à Busca</a>
        </nav>
    </header>

    <main>
        <form id="form-login">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"  placeholder="sally@email.com" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha"  placeholder="123" required>

            <button type="submit">
                <i class="material-icons">login</i> Entrar
            </button>
        </form>

        <a href="2.2_Pagina_de_Cadastro_Usuario.html">Criar conta</a>
    </main>

    <footer>
        <p>&copy; 2025 Sally Motors. Todos os direitos reservados.</p>
    </footer>

    <script>
        // quando o usuário clica em "Entrar", a função 'async' é disparada
        document.getElementById('form-login').addEventListener('submit', async function (e) {
            e.preventDefault();

            const form = e.target;
            const formData = new FormData(form);

            // Usa 'fetch' para enviar os dados de login para o nosso script no servidor
            // O 'await' pausa o código aqui até que o servidor responda
            try {
                const response = await fetch('php/controlador.php?acao=login', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    // Se o login for bem-sucedido, redireciona para a página principal interna
                    window.location.href = '2.5_Pagina_Principal_Interna.php';
                } else {
                    // Se falhar, exibe a mensagem de erro retornada pelo servidor
                    alert(result.message || 'Falha no login. Verifique seus dados.');
                }
            } catch (error) {
                console.error('Erro na requisição:', error);
                alert('Ocorreu um erro de comunicação com o servidor.');
            }
        });
    </script>


</body>

</html>
