<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sally Motors | Portal de Veículos</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="logo-titulo">
            <img src="images/logo.png" alt="logo" width="100" height="100">
            <h1>Sally Motors</h1>
        </div>
        <div class="header-nav">
            <a href="2.3_Pagina_de_Login.html">Login</a>
        </div>
    </header>

    <nav>
        <div class="filter-group">
            <div>
                <p><label>Marca do Veículo:
                        <select name="marca" id="select-marca">
                            <option value="" selected>Selecione</option>
                        </select>
                    </label></p>
            </div>
            <div>
                <p><label>Modelo do Veículo:
                        <select name="modelo" id="select-modelo">
                            <option value="" selected>Selecione</option>
                        </select>
                    </label></p>
            </div>
            <div>
                <p><label>Localização:
                        <select name="cidade" id="select-cidade">
                            <option value="" selected>Selecione</option>
                        </select>
                    </label></p>
            </div>
        </div>
    </nav>
    <main>
        <div class="container" id="anuncios-container">
            <!-- Os cards dos anúncios serão inseridos aqui -->
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Sally Motors. Todos os direitos reservados.</p>
    </footer>

    <script>
        window.onload = function () {
            const selectMarca = document.getElementById('select-marca');
            const selectModelo = document.getElementById('select-modelo');
            const selectCidade = document.getElementById('select-cidade');
            const anunciosContainer = document.getElementById('anuncios-container');

            // Limpa um <select> (mantém apenas a primeira opção "Selecione")
            function limparSelect(selectElement) {
                // Enquanto o select tiver mais de uma opção, remove a segunda opção, 
                // faz isso em loop até sobrar só a primeira
                while (selectElement.options.length > 1) {
                    selectElement.remove(1);
                }
            }

            // Preenche dinamicamente um select
            // Pega uma lista de itens e cria um <option> para cada um dentro do <select> fornecido
            // selectElement - O elemento <select> que será preenchido
            // items - A lista de strings que virarão as novas opções
            function preencherSelect(selectElement, items) {
                items.forEach(item => { // Para cada item na lista
                    const option = document.createElement('option'); // cria um elemento <option> novo
                    option.value = item; // Define o valor
                    option.textContent = item; // e o texto da opção
                    selectElement.appendChild(option); // "empilha/coloca" a nova opção dentro do select
                });
            }

            // Busca e exibe os anúncios de acordo com os filtros
            function buscarAnuncios() {
                // pega os valores que o usuário selecionou nos filtros
                const marca = selectMarca.value;
                const modelo = selectModelo.value;
                const cidade = selectCidade.value;

                anunciosContainer.innerHTML = '<p>Buscando anúncios...</p>';

                // O encodeURIComponent garante que caracteres especiais (como espaços) sejam enviados corretamente.
                const url = `php/controlador.php?acao=buscarAnuncios&marca=${encodeURIComponent(marca)}&modelo=${encodeURIComponent(modelo)}&cidade=${encodeURIComponent(cidade)}`;
                let xhr = new XMLHttpRequest();
                xhr.open("GET", url);
                xhr.responseType = 'json'; // Espera uma resposta JSON do servidor

                // define o que fazer quando a resposta do servidor chegar
                xhr.onload = function () {
                    if (xhr.status === 200 && xhr.response) { // se a resposta for um sucesso e tiver conteúdo
                        const anuncios = xhr.response;
                        anunciosContainer.innerHTML = ''; // limpa a área de anúncios pra não misturar com os antigos

                        // Se a resposta vier com pelo menos um anúncio
                        if (anuncios.length > 0) {
                            anuncios.forEach(anuncio => { // para cada anúncio na resposta, monta um card em HTML
                                const card = document.createElement('div');
                                card.className = 'card';
                                const imgPath = `uploads/${anuncio.FotoPrincipal}`;

                                card.innerHTML = `
                            <h3>${anuncio.Marca} ${anuncio.Modelo}</h3>
                            <img src="${imgPath}" alt="Foto de ${anuncio.Modelo}" onerror="this.src='images/placeholder.png';">
                            <p class="marca"><strong>Marca:</strong> ${anuncio.Marca}</p>
                            <p class="modelo"><strong>Modelo:</strong> ${anuncio.Modelo}</p>
                            <p class="anodefabricacao"><strong>Ano de Fabricação:</strong> ${anuncio.Ano}</p>
                            <p class="localizacao"><strong>Localização:</strong> ${anuncio.Cidade}</p>
                            <p class="preco"><strong>R$</strong> ${parseFloat(anuncio.Valor).toFixed(2)}</p>
                            <a href="2.4_Pagina_Registro_Interesse.html?id=${anuncio.Id}" class="link-card">Registrar Interesse</a>
                        `;
                                anunciosContainer.appendChild(card); // adiciona o card no container de anúncios
                            });
                        } else {
                            anunciosContainer.innerHTML = '<p>Nenhum anúncio encontrado.</p>'; // se não encontrar nada, avisa o usuário
                        }
                    } else {
                        anunciosContainer.innerHTML = '<p>Erro ao buscar os anúncios.</p>';  // se der algum erro na requisição 
                    }
                };

                xhr.onerror = () => {
                    anunciosContainer.innerHTML = '<p>Erro de rede ao buscar anúncios.</p>'; //  // caso haja erro de rede 
                };

                xhr.send();
            }

            // Carrega as marcas
            // Pede ao servidor a lista das marcas disponíveis e usa a função
            // preencherSelect para preencher o primeiro filtro
            function carregarMarcas() {
                let xhr = new XMLHttpRequest();
                xhr.open("GET", "php/controlador.php?acao=getMarcas");
                xhr.responseType = 'json';

                xhr.onload = function () {
                    if (xhr.status === 200 && xhr.response) {
                        preencherSelect(selectMarca, xhr.response);
                    }
                };
                xhr.send();
            }

            // Carrega modelos de acordo com a marca
            // aciona quando o usuário escolhe uma marca
            function carregarModelos() {
                // Primeiro, limpa os menus de modelo e cidade, já que a marca mudou
                limparSelect(selectModelo);
                limparSelect(selectCidade);

                const marca = selectMarca.value;
                // Se o usuário voltou para "Selecione", busca todos os anúncios de novo
                if (!marca) {
                    buscarAnuncios();
                    return;
                }

                // pede ao servidor apenas os modelos daquela marca específica
                let xhr = new XMLHttpRequest();
                xhr.open("GET", `php/controlador.php?acao=getModelos&marca=${encodeURIComponent(marca)}`);
                xhr.responseType = 'json';

                xhr.onload = function () {
                    if (xhr.status === 200 && xhr.response) {
                        preencherSelect(selectModelo, xhr.response);
                    }
                    buscarAnuncios(); // depois de carregar os novos modelos chama a busca de anúncios para atualizar a lista
                };
                xhr.send();
            }

            // Carrega cidades de acordo com a marca e modelo
            // acionada quando o usuário escolhe um modelo
            function carregarCidades() {
                // limpa o menu de cidades para receber as novas opções
                limparSelect(selectCidade);

                const marca = selectMarca.value;
                const modelo = selectModelo.value;
                // se o usuário voltou para "Selecione", busca de novo com o filtro anterior (só marca)
                if (!modelo) {
                    buscarAnuncios();
                    return;
                }

                // Pede ao servidor as cidades onde tem carros com aquela marca e modelo
                let xhr = new XMLHttpRequest();
                xhr.open("GET", `php/controlador.php?acao=getCidades&marca=${encodeURIComponent(marca)}&modelo=${encodeURIComponent(modelo)}`);
                xhr.responseType = 'json';

                xhr.onload = function () {
                    if (xhr.status === 200 && xhr.response) {
                        preencherSelect(selectCidade, xhr.response);
                    }
                    buscarAnuncios();
                };
                xhr.send();
            }

            // Eventos de mudança nos selects
            selectMarca.addEventListener('change', carregarModelos); // quando a marca mudar, carrega os modelos
            selectModelo.addEventListener('change', carregarCidades); // quando o modelo mudar, carrega as cidades
            selectCidade.addEventListener('change', buscarAnuncios); // quando a cidade mudar, busca os anúncios

            // Inicialização: A função `init` organiza o que deve acontecer assim que a página é carregada.
            function init() {
                carregarMarcas();   // carrega as marcas no primeiro select
                buscarAnuncios();   // mostra os primeiros anúncios sem filtro para página não ficar vazia
            }

            init();
        };
    </script>

</body>

</html>
