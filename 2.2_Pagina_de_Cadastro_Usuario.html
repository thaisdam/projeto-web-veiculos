<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Cadastro | Anunciante</title>
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="logo-titulo"> <img src="images/logo.png" alt="logo" width="100" height="100">
            <h1>Sally Motors</h1>
        </div>
        <nav class="header-nav">
            <a href="2.3_Pagina_de_Login.html">Voltar ào Login</a>
        </nav>
    </header>
    <main>
        <form id="form-cadastro">
            <div>
                <div>
                    <h1>Cadastro de Usuário</h1>
                </div>
            </div>

            <div>
                <label for="nome"> Nome Completo </label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div>
                <label for="cpf"> CPF </label>
                <input type="text" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" id="cpf" name="cpf" required>
            </div>
            <div>
                <label for="email"> E-mail </label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="senha"> Senha </label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <div>
                <label for="telefone"> Telefone </label>
                <input type="tel" id="telefone" name="telefone" required>
            </div>
            <div>
                <button type="submit"> Cadastrar</button>
            </div>
        </form>
    </main>
    <footer>
        <div>
            <p>&copy; 2025 Sally Motors. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        // Adiciona um listener para o evento de submit do formulário com o id 'form-cadastro'
        // quando o usuário clicar no botão "Cadastrar" a função será executada
        document.getElementById('form-cadastro').addEventListener('submit', async function (e) {

            // Impede o comportamento padrão do formulário, que é recarregar a página
            e.preventDefault();

            const form = e.target; // Pega o próprio formulário que disparou o evento
            const formData = new FormData(form); // Cria um objeto FormData, um pacote de dados do formulário

            try {
                // Faz a requisição para o controlador usando a API Fetch
                const response = await fetch('php/controlador.php?acao=cadastrarAnunciante', {
                    method: 'POST',
                    body: formData // O corpo da mensagem é o pacote de dados do formulário
                });

                // Converte a resposta do servidor de JSON para um objeto JavaScript
                const result = await response.json();

                if (result.success) {
                    alert('Cadastro realizado com sucesso!');
                    // Redireciona o usuário para a página de login após o sucesso
                    window.location.href = '2.3_Pagina_de_Login.html';
                } else {
                    // Exibe uma mensagem de erro se o cadastro falhar
                    alert('Falha no cadastro: ' + result.message);
                }
            } catch (error) { // Se der um erro técnico (como falha de rede ou o servidor estar fora do ar), o 'catch' trata esse erro
                console.error('Erro na requisição:', error);
                alert('Ocorreu um erro de comunicação com o servidor. Tente novamente.');
            }
        });
    </script>
</body>

</html>
